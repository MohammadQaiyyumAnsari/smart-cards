<!DOCTYPE html>
<html lang="hi">
<head>

      display: inline-block;
      padding: 12px 24px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
    }
    .demo-links { margin-top: 24px; padding-top: 20px; border-top: 1px solid #334155; }
