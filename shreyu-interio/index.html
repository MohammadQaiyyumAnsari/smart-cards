<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shreyu Interio - Digital Visiting Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body {
      background: linear-gradient(135deg, #1c1917 0%, #292524 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .banner { height: 115px; background: linear-gradient(135deg, #b45309, #d97706); }
    .avatar-wrap { margin-top: -58px; display: flex; justify-content: center; }
    .avatar {
      width: 116px; height: 116px; border-radius: 50%;
      border: 5px solid #ffffff; object-fit: contain; background: #ffffff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }
    .info { padding: 14px 24px 24px; }
    .name { font-size: 22px; font-weight: 700; color: #1c1917; }
    .role { font-size: 13.5px; font-weight: 500; color: #b45309; margin-top: 2px; }
    .bio { font-size: 12.5px; color: #57534e; margin-top: 10px; line-height: 1.5; }
    .save-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; margin-top: 20px; padding: 14px;
      background: #16a34a; color: #ffffff; text-decoration: none;
      font-size: 15px; font-weight: 600; border-radius: 14px;
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.3);
    }
    .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .action-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px; background: #f5f5f4; color: #1c1917; text-decoration: none;
      font-size: 13.5px; font-weight: 600; border-radius: 12px;
    }
    .address-box {
      margin-top: 16px; padding: 12px; background: #fafaf9;
      border-radius: 12px; font-size: 12px; color: #57534e; line-height: 1.5;
    }
    .footer { padding: 12px; background: #f5f5f4; font-size: 11px; color: #a8a29e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="banner"></div>
    <div class="avatar-wrap">
      <img class="avatar" src="./logo.png" alt="Shreyu Interio Logo" />
    </div>
    <div class="info">
      <h1 class="name">Shreyu Interio</h1>
      <p class="role">Luxury Home Interiors & Modular Kitchens</p>
      <p class="bio">2BHK / 3BHK Turnkey Interiors | Custom Furniture | False Ceiling & Lighting</p>

      <a class="save-btn" href="./contact.vcf" download="Shreyu_Interio.vcf">
        📥 Save Contact to Phone
      </a>

      <div class="actions">
        <a class="action-btn" href="tel:+919876543211">📞 Call Now</a>
        <a class="action-btn" href="https://wa.me/919876543211?text=Hello%20Shreyu%20Interio" target="_blank">💬 WhatsApp</a>
        <a class="action-btn" href="mailto:info@shreyuinterio.com">✉️ Email</a>
        <a class="action-btn" href="https://maps.google.com/?q=Nagole+Hyderabad" target="_blank">📍 Location</a>
      </div>

      <div class="address-box">🏢 Nagole, Hyderabad, Telangana 500068</div>
    </div>
    <div class="footer">Powered by Digital Dot Ads</div>
  </div>
</body>
</html>
